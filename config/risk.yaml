# Risk limits. risk-officer holds a veto (G8). Monte Carlo and tail estimates
# feed P(breach) and P(ruin). Sizing is fixed-fraction with a halving rule
# after drawdown.

account:
  base_currency: USDT
  starting_equity: null          # set per deployment

drawdown:
  max_drawdown: 0.25             # hard stop on peak-to-trough equity
  daily_loss_limit: 0.05         # halt new risk for the UTC day if breached
  weekly_loss_limit: 0.10

breach:
  p_breach_ceiling: 0.05         # P(hit max_drawdown over 1y horizon) must be <=
  p_ruin_ceiling: 0.005          # P(equity < 50% of start) must be <=
  horizon_days: 365
  monte_carlo_paths: 10000
  block_bootstrap_block_bars: 168

sizing:
  method: fixed_fraction
  base_fraction: 0.10            # fraction of equity at full conviction
  vol_target_annual: 0.20        # scale positions to this portfolio vol
  per_coin_cap: 0.15             # max gross weight in any one coin
  gross_leverage_cap: 2.0
  halve_after_drawdown:
    trigger_drawdown: 0.10       # when equity is 10% below peak
    multiplier: 0.5              # cut base_fraction in half
    restore_rule: "recover to within 3% of peak for 5 consecutive days"

tail:
  var_confidence: 0.99
  es_confidence: 0.975
  stress_scenarios:
    - "2020-03 style: -50% market in 48h, cross-coin corr -> 0.95"
    - "funding spike: 3x cap for 72h on longs"
    - "liquidation cascade: 5x normal slippage for 6h"

correlation_regime:
  # from make_synth.py and, later, real data: corr surges in crashes.
  assume_diversification_fails_in_stress: true
